<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Checkpoint</title>
<style>body{margin:0;padding:24px 16px;background:#F6F7F9;color:#5A6575;font:13px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif}a{color:#1F3A93}</style>
</head>
<body>
<p id="loaderMsg">Loading…</p>
<script>
/* Loader: always fetches the latest version of the app, bypassing GitHub Pages' 10-minute cache.
   The real app lives in panel.html — edit that file, not this one. */
(function () {
  var APP = "panel.html", v = Date.now();
  fetch(APP + "?v=" + v, { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); })
    .then(function (html) {
      // Local scripts (config.js, slide-details.js) get the same cache-busting stamp
      html = html.replace(/(<script[^>]+src=")(?!https?:|\/\/)([^"?]+)(")/g, "$1$2?v=" + v + "$3");
      document.open(); document.write(html); document.close();
    })
    .catch(function (e) {
      document.getElementById("loaderMsg").innerHTML = "Couldn't load QA Checkpoint (" + e.message + "). <a href=\"#\" onclick=\"location.reload();return false\">Try again</a>";
    });
})();
</script>
</body>
</html>
