<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slide Review</title>
<link rel="icon" href="assets/icon-32.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F6F7F9; --surface: #FFFFFF; --stage: #E4E7EC; --ink: #18202B; --muted: #5A6575; --line: #DCE0E6;
    --brand: #1F3A93; --brand-hover: #182E78; --focus: #3D66F5;
    --wait: #8A6412; --wait-tint: #FBF1D9;
    --ok: #1E8A5A;   --ok-tint: #E4F3EB;
    --fix: #B4441B;  --fix-tint: #FBEAE2;
    --font: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; }
  button, input, textarea, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 18px; margin: 0; }
  h3 { font-size: 13px; margin: 0 0 8px; color: var(--muted); font-weight: 600; }

  .primary { border: 0; border-radius: 8px; padding: 9px 14px; cursor: pointer; background: var(--brand); color: #fff; font-weight: 600; }
  .primary:hover:not(:disabled) { background: var(--brand-hover); }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .ghost { border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; background: var(--surface); cursor: pointer; }
  .ghost:hover:not(:disabled) { border-color: #B9C0CA; }
  .ghost:disabled { opacity: .5; cursor: not-allowed; }
  .link { border: 0; background: none; padding: 0; color: var(--brand); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
  .field { display: block; margin-bottom: 12px; }
  .field > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .field input, textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--surface); }
  .field input:focus, textarea:focus { border-color: var(--focus); outline: none; }
  .msg { margin: 10px 0 0; font-size: 13px; }
  .msg.err { color: var(--fix); background: var(--fix-tint); padding: 8px 10px; border-radius: 8px; }
  .msg:empty { display: none; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 999px; white-space: nowrap; background: #EEF0F3; color: var(--muted); }
  .pill.ready { background: var(--wait-tint); color: var(--wait); }
  .pill.approved { background: var(--ok-tint); color: var(--ok); }
  .pill.changes { background: var(--fix-tint); color: var(--fix); }

  /* Login */
  .login { max-width: 360px; margin: 12vh auto; padding: 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
  .login p { color: var(--muted); margin: 6px 0 18px; }
  .login .primary { width: 100%; }

  /* Board */
  .topbar { height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 2; }
  .topbar h1 { flex: 1; }
  .tabs { display: flex; background: #EEF0F3; border-radius: 9px; padding: 3px; }
  .tabs button { border: 0; background: none; padding: 5px 12px; border-radius: 7px; cursor: pointer; color: var(--muted); font-weight: 500; }
  .tabs button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(24,32,43,.12); }
  .me { color: var(--muted); font-size: 13px; }
  .board { display: grid; grid-template-columns: 280px 1fr; min-height: calc(100vh - 56px); }
  .sidebar { border-right: 1px solid var(--line); padding: 14px 10px; background: var(--surface); }
  .projects { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  .projects button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 10px; border-radius: 8px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; }
  .projects button:hover { background: var(--bg); }
  .projects button[aria-current="true"] { background: #E9EDF8; }
  .projects strong { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .projects small { color: var(--muted); font-size: 12px; grid-column: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { grid-row: 1 / span 2; grid-column: 2; align-self: center; min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px; background: var(--wait-tint); color: var(--wait); font-size: 12px; font-weight: 700; display: grid; place-items: center; }
  .count.zero { background: none; color: var(--muted); font-weight: 500; }
  .content { padding: 20px 24px 40px; min-width: 0; }
  .content-head { display: flex; align-items: baseline; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .content-head p { margin: 0; color: var(--muted); }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; }
  .slide-card { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0; cursor: pointer; text-align: left; overflow: hidden; display: flex; flex-direction: column; }
  .slide-card:hover { border-color: #B9C0CA; }
  .slide-card .img { aspect-ratio: 16 / 9; background: #EEF0F3; display: block; }
  .slide-card img { width: 100%; height: 100%; object-fit: contain; display: block; background: #fff; }
  .slide-card .info { padding: 10px 12px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
  .slide-card .info strong { font-weight: 600; }
  .slide-card .info small { color: var(--muted); font-size: 12px; grid-column: 1 / -1; }
  .empty-state { color: var(--muted); padding: 48px 0; text-align: center; }
  .empty-state strong { display: block; color: var(--ink); font-size: 16px; margin-bottom: 4px; }

  /* Review */
  .review { position: fixed; inset: 0; background: var(--stage); display: grid; grid-template-rows: 56px 1fr; z-index: 10; }
  .rv-bar { display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--surface); border-bottom: 1px solid var(--line); }
  .rv-title { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; }
  .rv-title strong { font-size: 16px; white-space: nowrap; }
  .rv-title span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rv-bar select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--surface); }
  .navbtns { display: flex; gap: 4px; }
  .navbtns .ghost { padding: 6px 10px; }
  .rv-body { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  .stage { display: grid; place-items: center; padding: 24px; overflow: auto; min-width: 0; }
  .older { background: var(--wait-tint); color: var(--wait); padding: 8px 12px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; display: flex; gap: 10px; align-items: center; justify-content: center; }
  figure.slide { position: relative; margin: 0; display: inline-block; cursor: crosshair; box-shadow: 0 1px 3px rgba(24,32,43,.14), 0 8px 28px rgba(24,32,43,.10); background: #fff; line-height: 0; }
  figure.slide img { display: block; max-width: 100%; max-height: calc(100vh - 56px - 96px); width: auto; height: auto; user-select: none; -webkit-user-drag: none; }
  .pin { position: absolute; transform: translate(-50%, -100%); width: 28px; height: 28px; border-radius: 50% 50% 50% 0; rotate: -45deg; background: var(--brand); border: 2px solid #fff; box-shadow: 0 2px 6px rgba(24,32,43,.35); display: grid; place-items: center; cursor: pointer; padding: 0; line-height: 1; }
  .pin span { rotate: 45deg; color: #fff; font-size: 12px; font-weight: 700; }
  .pin.resolved { background: #8C95A3; }
  .pin.draft { background: var(--surface); border: 2px dashed var(--brand); }
  .pin.draft span { color: var(--brand); }
  .pin.hot { background: var(--fix); scale: 1.15; }

  .panel { background: var(--surface); border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  .panel-top { padding: 16px; border-bottom: 1px solid var(--line); }
  .by { margin: 0 0 8px; color: var(--muted); font-size: 13px; }
  .by strong { color: var(--ink); }
  .note { background: var(--bg); border-radius: 8px; padding: 8px 10px; margin: 0 0 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .decision { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .decision button { border-radius: 8px; padding: 9px 10px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: var(--surface); }
  .decision .approve[aria-pressed="true"] { background: var(--ok); border-color: var(--ok); color: #fff; }
  .decision .changes[aria-pressed="true"] { background: var(--fix); border-color: var(--fix); color: #fff; }
  .decision button:disabled { opacity: .5; cursor: not-allowed; }
  .decision-state { margin: 10px 0 0; font-size: 12px; color: var(--muted); }
  .thread { padding: 16px; overflow: auto; }
  .comments { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .comment { display: grid; grid-template-columns: 26px 1fr; gap: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .comment.hot { border-color: var(--fix); }
  .comment.resolved { opacity: .55; }
  .num { width: 24px; height: 24px; border-radius: 50%; background: var(--brand); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .num.general { background: #E3E6EB; color: var(--muted); }
  .comment p { margin: 0 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment .meta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 12px; }
  .comments .empty { color: var(--muted); font-size: 13px; }
  .composer { border-top: 1px solid var(--line); padding: 12px 16px 16px; }
  .composer p { margin: 0 0 8px; font-size: 12px; color: var(--muted); }
  .composer textarea { resize: vertical; min-height: 64px; }
  .composer .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

  @media (max-width: 900px) {
    .board { grid-template-columns: 1fr; }
    .sidebar { border-right: 0; border-bottom: 1px solid var(--line); }
    .rv-body { grid-template-columns: 1fr; grid-template-rows: auto auto; overflow: auto; }
    .panel { border-left: 0; border-top: 1px solid var(--line); }
    figure.slide img { max-height: 60vh; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
  <div id="configError" class="login" hidden><h1>Setup needed</h1><p>Fill in config.js with your Supabase details (see the setup guide).</p></div>

  <!-- Sign in -->
  <section id="loginView" class="login" hidden>
    <h1>Slide Review</h1>
    <p>Sign in with your team account to review slides.</p>
    <label class="field"><span>Email</span><input id="email" type="email" autocomplete="username"></label>
    <label class="field"><span>Password</span><input id="password" type="password" autocomplete="current-password"></label>
    <button id="signInBtn" class="primary">Sign in</button>
    <p id="loginMsg" class="msg" role="status" aria-live="polite"></p>
  </section>

  <!-- Board -->
  <div id="boardView" hidden>
    <header class="topbar">
      <h1>Slide Review</h1>
      <div class="tabs" role="group" aria-label="Show">
        <button id="tabWaiting" aria-pressed="true">Waiting for review</button>
        <button id="tabAll" aria-pressed="false">All slides</button>
      </div>
      <span class="me" id="me"></span>
      <button id="signOutBtn" class="link">Sign out</button>
    </header>
    <div class="board">
      <nav class="sidebar" aria-label="Projects"><ol id="projects" class="projects"></ol></nav>
      <main class="content" id="content"></main>
    </div>
  </div>

  <!-- Review one slide -->
  <div id="reviewView" class="review" hidden role="dialog" aria-modal="true" aria-labelledby="rvSlide">
    <header class="rv-bar">
      <button id="backBtn" class="ghost">Back to slides</button>
      <div class="rv-title"><strong id="rvSlide"></strong><span id="rvProject"></span></div>
      <label><span class="sr" hidden>Version</span><select id="versionSelect" aria-label="Version"></select></label>
      <div class="navbtns">
        <button id="prevBtn" class="ghost" aria-label="Previous slide">‹</button>
        <button id="nextBtn" class="ghost" aria-label="Next slide">›</button>
      </div>
    </header>
    <div class="rv-body">
      <div class="stage">
        <div>
          <div id="olderBanner" class="older" hidden><span id="olderText"></span><button id="toLatest" class="link">View latest</button></div>
          <figure class="slide" id="figure"><img id="rvImg" alt=""><div id="pins"></div></figure>
        </div>
      </div>
      <aside class="panel">
        <div class="panel-top">
          <p class="by" id="rvBy"></p>
          <p class="note" id="rvNote" hidden></p>
          <div class="decision">
            <button id="approveBtn" class="approve" aria-pressed="false">Approve</button>
            <button id="changesBtn" class="changes" aria-pressed="false">Request changes</button>
          </div>
          <p class="decision-state" id="decisionState"></p>
        </div>
        <div class="thread">
          <h3 id="commentCount">Comments</h3>
          <ol id="comments" class="comments"></ol>
        </div>
        <div class="composer">
          <p id="pinHint">Click anywhere on the slide to pin a comment, or write a general comment.</p>
          <textarea id="commentBody" aria-label="Comment" placeholder="Write a comment"></textarea>
          <div class="row">
            <button id="removePin" class="ghost" hidden>Remove pin</button>
            <button id="sendComment" class="primary">Add comment</button>
          </div>
          <p id="rvMsg" class="msg" role="status" aria-live="polite"></p>
        </div>
      </aside>
    </div>
  </div>

<script>
const cfg = window.SLIDE_REVIEW_CONFIG || {};
const STATUS_LABEL = { ready: "Waiting for review", approved: "Approved", changes: "Changes requested" };
const S = { sb: null, user: null, shots: [], comments: {}, urls: {}, versions: {}, projects: {}, filter: "waiting", project: null, slideKey: null, shotId: null, draft: null, hot: null };
const $ = (id) => document.getElementById(id);
const keyOf = (s) => s.file_key + "|" + s.slide_id;
const displayName = (u) => (u && u.user_metadata && u.user_metadata.name) || (u && u.email ? u.email.split("@")[0] : "");
function debounce(fn, ms) { let t; return () => { clearTimeout(t); t = setTimeout(fn, ms); }; }
function say(el, text, kind) { el.textContent = text || ""; el.className = "msg" + (kind ? " " + kind : ""); }
function ago(iso) {
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return "just now"; if (m < 60) return m + " min ago";
  const h = Math.round(m / 60); if (h < 24) return h + " h ago";
  return new Date(iso).toLocaleDateString([], { day: "numeric", month: "short" });
}
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

/* ---------- data ---------- */
async function loadAll() {
  const since = new Date(Date.now() - (cfg.DAYS_TO_SHOW || 21) * 864e5).toISOString();
  const { data, error } = await S.sb.from("slide_shots").select("*").gte("created_at", since).order("created_at", { ascending: false }).limit(3000);
  if (error) throw error;
  S.shots = data;
  S.comments = {};
  const ids = data.map((r) => r.id);
  for (let i = 0; i < ids.length; i += 150) {
    const res = await S.sb.from("shot_comments").select("*").in("shot_id", ids.slice(i, i + 150)).order("created_at");
    if (res.error) throw res.error;
    res.data.forEach((c) => { (S.comments[c.shot_id] = S.comments[c.shot_id] || []).push(c); });
  }
  buildIndex();
}
function buildIndex() {
  S.versions = {};
  S.shots.forEach((s) => { (S.versions[keyOf(s)] = S.versions[keyOf(s)] || []).push(s); });
  Object.values(S.versions).forEach((a) => a.sort((x, y) => y.version - x.version));
  S.projects = {};
  Object.values(S.versions).forEach((a) => {
    const l = a[0];
    const p = S.projects[l.project] = S.projects[l.project] || { name: l.project, slides: [], designers: new Set(), waiting: 0, lastAt: "" };
    p.slides.push(l); p.designers.add(l.designer);
    if (l.status === "ready") p.waiting++;
    if (l.created_at > p.lastAt) p.lastAt = l.created_at;
  });
  Object.values(S.projects).forEach((p) => p.slides.sort((a, b) => a.designer.localeCompare(b.designer) || a.slide_number - b.slide_number));
}
async function ensureUrls(shots) {
  const now = Date.now();
  const need = [...new Set(shots.map((s) => s.image_path))].filter((p) => !S.urls[p] || S.urls[p].exp < now + 60000);
  for (let i = 0; i < need.length; i += 100) {
    const { data, error } = await S.sb.storage.from("slides").createSignedUrls(need.slice(i, i + 100), 3600);
    if (error) throw error;
    data.forEach((d) => { if (d.signedUrl) S.urls[d.path] = { url: d.signedUrl, exp: now + 3600 * 1000 }; });
  }
}
const urlFor = (s) => (S.urls[s.image_path] || {}).url || "";
const pinnedNumbers = (cs) => { let n = 0; const m = {}; cs.forEach((c) => { if (c.x !== null && c.y !== null) m[c.id] = ++n; }); return m; };

/* ---------- board ---------- */
function visibleProjects() {
  return Object.values(S.projects)
    .filter((p) => S.filter === "all" || p.waiting > 0)
    .sort((a, b) => (b.waiting > 0) - (a.waiting > 0) || b.lastAt.localeCompare(a.lastAt));
}
async function renderBoard() {
  const totalWaiting = Object.values(S.projects).reduce((n, p) => n + p.waiting, 0);
  $("tabWaiting").textContent = "Waiting for review" + (totalWaiting ? " (" + totalWaiting + ")" : "");
  $("tabWaiting").setAttribute("aria-pressed", String(S.filter === "waiting"));
  $("tabAll").setAttribute("aria-pressed", String(S.filter === "all"));
  $("me").textContent = displayName(S.user);

  const projects = visibleProjects();
  if (!projects.find((p) => p.name === S.project)) S.project = projects.length ? projects[0].name : null;

  const list = $("projects"); list.innerHTML = "";
  projects.forEach((p) => {
    const li = el("li"); const b = el("button");
    if (p.name === S.project) b.setAttribute("aria-current", "true");
    b.append(el("strong", "", p.name), el("span", "count" + (p.waiting ? "" : " zero"), p.waiting ? p.waiting : "0"), el("small", "", [...p.designers].join(", ") + ", " + ago(p.lastAt)));
    b.onclick = () => { S.project = p.name; renderBoard(); };
    li.append(b); list.append(li);
  });

  const c = $("content"); c.innerHTML = "";
  if (!S.project) {
    const e = el("div", "empty-state");
    e.append(el("strong", "", S.filter === "waiting" ? "Nothing waiting for review" : "No slides yet"),
      document.createTextNode(S.filter === "waiting" ? "New slides appear here as soon as a designer marks them ready." : "Slides show up here once designers mark them ready in PowerPoint."));
    c.append(e); return;
  }
  const p = S.projects[S.project];
  const slides = p.slides.filter((s) => S.filter === "all" || s.status === "ready");
  const head = el("div", "content-head");
  head.append(el("h2", "", p.name), el("p", "", p.waiting + " waiting, " + p.slides.filter((s) => s.status === "approved").length + " approved, " + p.slides.length + " sent"));
  c.append(head);

  const multi = p.designers.size > 1;
  const grid = el("div", "cards");
  slides.forEach((s) => {
    const b = el("button", "slide-card");
    const box = el("span", "img"); const img = new Image(); img.alt = "Slide " + s.slide_number; img.loading = "lazy"; img.dataset.path = s.image_path;
    box.append(img);
    const info = el("span", "info");
    const cs = S.comments[s.id] || [];
    const open = cs.filter((x) => !x.resolved).length;
    info.append(el("strong", "", "Slide " + s.slide_number + (multi ? ", " + s.designer : "")), el("span", "pill " + s.status, STATUS_LABEL[s.status]),
      el("small", "", (multi ? "" : s.designer + ", ") + ago(s.created_at) + (s.version > 1 ? ", v" + s.version : "") + (open ? ", " + open + " open comment" + (open > 1 ? "s" : "") : "")));
    b.append(box, info);
    b.onclick = () => openReview(keyOf(s));
    grid.append(b);
  });
  c.append(grid);
  try { await ensureUrls(slides); } catch (e) {}
  grid.querySelectorAll("img[data-path]").forEach((img) => { const u = (S.urls[img.dataset.path] || {}).url; if (u) img.src = u; });
}

/* ---------- review ---------- */
function projectSlides() { const p = S.projects[S.project]; return p ? p.slides : []; }
function openReview(slideKey, shotId) {
  S.slideKey = slideKey; S.shotId = shotId || null; S.draft = null; S.hot = null;
  $("commentBody").value = ""; say($("rvMsg"), "");
  $("reviewView").hidden = false;
  renderReview();
  $("backBtn").focus();
}
function closeReview() { $("reviewView").hidden = true; S.slideKey = null; renderBoard(); }
function currentShot() {
  const vers = S.versions[S.slideKey]; if (!vers) return null;
  return vers.find((v) => v.id === S.shotId) || vers[0];
}
async function renderReview() {
  const shot = currentShot(); if (!shot) { closeReview(); return; }
  S.shotId = shot.id;
  const vers = S.versions[S.slideKey];
  const latest = vers[0], isLatest = shot.id === latest.id;

  $("rvSlide").textContent = "Slide " + shot.slide_number + " of " + shot.total_slides;
  $("rvProject").textContent = shot.project;
  const sel = $("versionSelect"); sel.innerHTML = "";
  vers.forEach((v) => { const o = el("option", "", "v" + v.version + ", " + ago(v.created_at)); o.value = v.id; if (v.id === shot.id) o.selected = true; sel.append(o); });
  sel.hidden = vers.length < 2;
  $("olderBanner").hidden = isLatest;
  $("olderText").textContent = "You're viewing v" + shot.version + ". The latest is v" + latest.version + ".";

  const list = projectSlides(); const i = list.findIndex((s) => keyOf(s) === S.slideKey);
  $("prevBtn").disabled = i <= 0; $("nextBtn").disabled = i < 0 || i >= list.length - 1;

  $("rvBy").innerHTML = ""; $("rvBy").append("Sent by ", el("strong", "", shot.designer), ", " + ago(shot.created_at));
  $("rvNote").hidden = !shot.note; $("rvNote").textContent = shot.note || "";

  $("approveBtn").setAttribute("aria-pressed", String(shot.status === "approved"));
  $("changesBtn").setAttribute("aria-pressed", String(shot.status === "changes"));
  $("approveBtn").disabled = $("changesBtn").disabled = !isLatest;
  $("decisionState").textContent = !isLatest ? "Decisions apply to the latest version." :
    shot.reviewed_by ? STATUS_LABEL[shot.status] + " by " + shot.reviewed_by + ", " + ago(shot.reviewed_at) : "Not reviewed yet.";

  // image
  const img = $("rvImg"); img.alt = "Slide " + shot.slide_number + ", version " + shot.version;
  try { await ensureUrls([shot]); } catch (e) {}
  if (img.src !== urlFor(shot)) img.src = urlFor(shot);

  renderComments(shot);
}
function renderComments(shot) {
  const cs = S.comments[shot.id] || [];
  const nums = pinnedNumbers(cs);
  const pins = $("pins"); pins.innerHTML = "";
  cs.forEach((c) => {
    if (!nums[c.id]) return;
    const p = el("button", "pin" + (c.resolved ? " resolved" : "") + (S.hot === c.id ? " hot" : ""));
    p.style.left = (c.x * 100) + "%"; p.style.top = (c.y * 100) + "%";
    p.setAttribute("aria-label", "Comment " + nums[c.id]);
    p.append(el("span", "", nums[c.id]));
    p.onclick = (e) => { e.stopPropagation(); S.hot = c.id; renderComments(shot); const t = document.querySelector('[data-cid="' + c.id + '"]'); if (t) t.scrollIntoView({ block: "nearest" }); };
    pins.append(p);
  });
  if (S.draft) {
    const d = el("span", "pin draft"); d.style.left = (S.draft.x * 100) + "%"; d.style.top = (S.draft.y * 100) + "%";
    d.append(el("span", "", Object.keys(nums).length + 1)); pins.append(d);
  }
  $("pinHint").textContent = S.draft ? "Pin " + (Object.keys(nums).length + 1) + " placed. Write what should change there." : "Click anywhere on the slide to pin a comment, or write a general comment.";
  $("removePin").hidden = !S.draft;

  const open = cs.filter((c) => !c.resolved).length;
  $("commentCount").textContent = cs.length ? cs.length + " comment" + (cs.length > 1 ? "s" : "") + (open !== cs.length ? ", " + open + " open" : "") : "Comments";
  const list = $("comments"); list.innerHTML = "";
  if (!cs.length) { list.append(el("li", "empty", "No comments yet.")); }
  cs.forEach((c) => {
    const li = el("li", "comment" + (c.resolved ? " resolved" : "") + (S.hot === c.id ? " hot" : "")); li.dataset.cid = c.id;
    li.onmouseenter = () => { S.hot = c.id; renderPinsOnly(shot); };
    li.onmouseleave = () => { S.hot = null; renderPinsOnly(shot); };
    const n = el("span", "num" + (nums[c.id] ? "" : " general"), nums[c.id] || "•");
    const body = el("div"); body.append(el("p", "", c.body));
    const meta = el("div", "meta"); meta.append(el("span", "", c.author + ", " + ago(c.created_at)));
    const r = el("button", "link", c.resolved ? "Reopen" : "Resolve"); r.onclick = () => toggleResolved(c);
    meta.append(r); body.append(meta); li.append(n, body); list.append(li);
  });
}
function renderPinsOnly(shot) {
  const cs = S.comments[shot.id] || []; const nums = pinnedNumbers(cs);
  const pins = [...document.querySelectorAll("#pins .pin:not(.draft)")];
  cs.filter((c) => nums[c.id]).forEach((c, i) => { if (pins[i]) pins[i].classList.toggle("hot", S.hot === c.id); });
}

/* ---------- actions ---------- */
async function addComment() {
  const shot = currentShot(); const body = $("commentBody").value.trim();
  if (!shot || !body) { say($("rvMsg"), "Write a comment first.", "err"); return; }
  $("sendComment").disabled = true;
  const row = { shot_id: shot.id, author: displayName(S.user), body: body, x: S.draft ? S.draft.x : null, y: S.draft ? S.draft.y : null };
  const { data, error } = await S.sb.from("shot_comments").insert(row).select().single();
  $("sendComment").disabled = false;
  if (error) { say($("rvMsg"), "Comment wasn't saved: " + error.message, "err"); return; }
  (S.comments[shot.id] = S.comments[shot.id] || []).push(data);
  $("commentBody").value = ""; S.draft = null; say($("rvMsg"), "");
  renderComments(shot);
}
async function toggleResolved(c) {
  const { error } = await S.sb.from("shot_comments").update({ resolved: !c.resolved }).eq("id", c.id);
  if (error) { say($("rvMsg"), "Couldn't update the comment: " + error.message, "err"); return; }
  c.resolved = !c.resolved; renderComments(currentShot());
}
async function decide(status) {
  const shot = currentShot(); if (!shot) return;
  const next = shot.status === status ? "ready" : status; // pressing again undoes the decision
  const patch = { status: next, reviewed_by: next === "ready" ? null : displayName(S.user), reviewed_at: next === "ready" ? null : new Date().toISOString() };
  const { error } = await S.sb.from("slide_shots").update(patch).eq("id", shot.id);
  if (error) { say($("rvMsg"), "Couldn't save the decision: " + error.message, "err"); return; }
  Object.assign(shot, patch); buildIndex(); renderReview();
}
function step(dir) {
  const list = projectSlides(); const i = list.findIndex((s) => keyOf(s) === S.slideKey);
  const t = list[i + dir]; if (t) openReview(keyOf(t));
}

/* ---------- auth + start ---------- */
async function signIn() {
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || !password) { say($("loginMsg"), "Enter your email and password.", "err"); return; }
  $("signInBtn").disabled = true; say($("loginMsg"), "Signing in…");
  const { data, error } = await S.sb.auth.signInWithPassword({ email: email, password: password });
  $("signInBtn").disabled = false;
  if (error) { say($("loginMsg"), "Sign-in failed: " + error.message, "err"); return; }
  say($("loginMsg"), ""); enter(data.user);
}
async function enter(user) {
  S.user = user;
  $("loginView").hidden = true; $("boardView").hidden = false;
  $("content").innerHTML = '<p class="empty-state">Loading slides…</p>';
  try { await loadAll(); } catch (e) { $("content").innerHTML = ""; $("content").append(el("p", "msg err", "Couldn't load slides: " + e.message)); return; }
  renderBoard();
  const reload = debounce(async () => { try { await loadAll(); renderBoard(); if (!$("reviewView").hidden) renderReview(); } catch (e) {} }, 500);
  S.sb.channel("review-board")
    .on("postgres_changes", { event: "*", schema: "public", table: "slide_shots" }, reload)
    .on("postgres_changes", { event: "*", schema: "public", table: "shot_comments" }, reload)
    .subscribe();
}

(async function start() {
  if (!cfg.SUPABASE_URL || !cfg.SUPABASE_ANON_KEY) { $("configError").hidden = false; return; }
  S.sb = supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY);

  $("signInBtn").onclick = signIn;
  $("password").addEventListener("keydown", (e) => { if (e.key === "Enter") signIn(); });
  $("signOutBtn").onclick = async () => { await S.sb.auth.signOut(); location.reload(); };
  $("tabWaiting").onclick = () => { S.filter = "waiting"; renderBoard(); };
  $("tabAll").onclick = () => { S.filter = "all"; renderBoard(); };
  $("backBtn").onclick = closeReview;
  $("prevBtn").onclick = () => step(-1);
  $("nextBtn").onclick = () => step(1);
  $("versionSelect").onchange = (e) => { S.shotId = e.target.value; S.draft = null; renderReview(); };
  $("toLatest").onclick = () => { S.shotId = null; S.draft = null; renderReview(); };
  $("approveBtn").onclick = () => decide("approved");
  $("changesBtn").onclick = () => decide("changes");
  $("sendComment").onclick = addComment;
  $("removePin").onclick = () => { S.draft = null; renderComments(currentShot()); };
  $("commentBody").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) addComment(); });

  $("figure").addEventListener("click", (e) => {
    if (e.target.closest(".pin:not(.draft)")) return;
    const r = $("rvImg").getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;
    if (x < 0 || x > 1 || y < 0 || y > 1) return;
    S.draft = { x: Math.round(x * 1000) / 1000, y: Math.round(y * 1000) / 1000 };
    renderComments(currentShot());
    $("commentBody").focus();
  });

  document.addEventListener("keydown", (e) => {
    if ($("reviewView").hidden) return;
    const typing = /^(TEXTAREA|INPUT|SELECT)$/.test(document.activeElement.tagName);
    if (e.key === "Escape") { if (S.draft) { S.draft = null; renderComments(currentShot()); } else if (!typing) closeReview(); }
    if (!typing && e.key === "ArrowLeft") step(-1);
    if (!typing && e.key === "ArrowRight") step(1);
  });

  const { data } = await S.sb.auth.getSession();
  if (data.session) enter(data.session.user); else { $("loginView").hidden = false; $("email").focus(); }
})();
</script>
