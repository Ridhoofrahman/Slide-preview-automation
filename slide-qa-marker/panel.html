<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slideshot</title>
<script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="slide-details.js"></script>
<script src="slideshot-hero.js"></script>
<script src="config.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* From Figma: Slide Review / Panel v2.1 */
    --canvas: #F6F7F9; --surface: #FFFFFF; --ink: #18202B; --title: #1F2430; --body: #3F4652; --muted: #5A6575; --secondary: #6B7280; --disabled: #8B93A1;
    --link: #1F3A93; --primary: #00308D; --primary-hover: #002770; --focus: #3D66F5;
    --outline: #E3E6EB; --line: #DCE0E6; --input: #8B93A1;
    --grey-bg: #EEF0F3; --grey-bd: #CDD2DA;
    --yellow-bg: #FDF5E6; --yellow-bd: #F4CC7F; --yellow-fg: #8D5D00;
    --red-bg: #FAE9EB; --red-bd: #E48F9A; --red-fg: #CA2135;
    --green-bg: #E6F8F2; --green-bd: #7FD8BD; --green-fg: #006B4B; --success: #33C297;
    --pin-bd: #9FC3EE; --scrim: rgba(31, 36, 48, .5); --overlay: rgba(14, 20, 40, .7);
    --font: "Geist", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 20px; }
  main { max-width: 520px; margin: 0 auto; }
  button, input, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  svg { display: block; }

  .container { padding: 16px 16px calc(var(--dock-h, 40px) + 24px); display: flex; flex-direction: column; gap: 20px; }
  .head { display: flex; flex-direction: column; gap: 4px; }
  .project { width: 100%; height: 32px; border: 1px solid transparent; background: transparent; font-size: 20px; line-height: 32px; font-weight: 500; padding: 0 6px; margin-left: -7px; border-radius: 6px; color: var(--ink); text-overflow: ellipsis; }
  .project:hover { border-color: var(--line); }
  .project:focus { border-color: var(--focus); background: var(--surface); outline: none; }
  .link { border: 0; background: none; padding: 0; color: var(--link); cursor: pointer; text-decoration: underline; text-underline-position: from-font; font-size: 13px; line-height: 1.45; font-family: var(--font); }
  a.link { align-self: flex-start; }
  #reviewLinkWrap { display: flex; line-height: 0; }
  #reviewLinkWrap:empty { display: none; }

  /* Tag (Figma: Slide status) */
  .tag { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; padding: 4px 8px; border-radius: 20px; border: 1px solid var(--grey-bd); background: var(--grey-bg); color: var(--body); font-size: 12px; line-height: 16px; white-space: nowrap; box-shadow: 0 1px 1px rgba(18,18,23,.05); }
  .ready { background: var(--yellow-bg); border-color: var(--yellow-bd); color: var(--yellow-fg); }
  .changes { background: var(--red-bg); border-color: var(--red-bd); color: var(--red-fg); }
  .approved { background: var(--green-bg); border-color: var(--green-bd); color: var(--green-fg); }

  /* Slide */
  .slide-part { display: flex; flex-direction: column; gap: 20px; }
  .slide-content { display: flex; flex-direction: column; gap: 16px; }
  .slide-content.tight { gap: 12px; }
  .slide-header { display: flex; flex-direction: column; gap: 8px; }
  .meta { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
  .meta-label { font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .thumb { position: relative; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background: #E9ECF0; }
  .thumb-inner { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tpins { position: absolute; inset: 0; pointer-events: none; }
  .tpin { position: absolute; transform: translate(-50%, -50%); width: 22px; height: 22px; border-radius: 11px; background: var(--primary); color: #fff; border: 1px solid var(--pin-bd); font-size: 12px; font-weight: 500; display: grid; place-items: center; }
  .tpin.resolved { background: var(--secondary); border-color: var(--grey-bd); }
  .sent-badge { position: absolute; right: 8px; bottom: 8px; background: var(--scrim); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); border: .5px solid var(--grey-bd); border-radius: 4px; padding: 2px 6px; color: #fff; font-size: 10px; line-height: 16px; box-shadow: 0 1px 1.5px rgba(18,18,23,.1), 0 1px 1px rgba(18,18,23,.06); }
  .thumb-refresh { position: absolute; right: 8px; bottom: 8px; width: 28px; height: 28px; border: 1px solid var(--outline); border-radius: 6px; background: var(--surface); color: var(--body); display: grid; place-items: center; cursor: pointer; }
  .thumb-refresh svg { width: 16px; height: 16px; }
  .sent-overlay { position: absolute; inset: 0; background: var(--overlay); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #fff; font-size: 16px; line-height: 24px; font-weight: 500; animation: fade 2.6s ease forwards; }
  .ok-icon { width: 24px; height: 24px; border-radius: 12px; background: var(--success); color: #fff; display: grid; place-items: center; }
  .ok-icon svg { width: 14px; height: 14px; }
  @keyframes fade { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
  .sent-note { margin: 0; font-size: 14px; line-height: 20px; color: var(--secondary); overflow-wrap: anywhere; }

  /* Notes */
  .add-note { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; cursor: pointer; color: var(--primary); font-size: 14px; line-height: 20px; font-weight: 500; }
  .add-note svg { width: 20px; height: 20px; }
  .undo-note { margin: 0; font-size: 12px; line-height: 16px; color: var(--muted); }
  .undo-note button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--primary); font-size: 12px; text-decoration: underline; text-underline-position: from-font; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field-head { display: flex; align-items: center; gap: 4px; font-size: 14px; line-height: 20px; color: var(--title); }
  .field-head span { flex: 1; }
  .icon-x { width: 24px; height: 24px; border: 0; border-radius: 8px; background: none; display: grid; place-items: center; cursor: pointer; color: var(--red-fg); padding: 0; }
  .icon-x svg { width: 16px; height: 16px; }
  .field textarea, .field input { width: 100%; background: var(--surface); border: 1px solid var(--input); border-radius: 8px; padding: 9px 8px; font-family: var(--font); font-size: 14px; line-height: 20px; color: var(--body); }
  .field textarea { height: 80px; min-height: 80px; resize: vertical; }
  .field textarea::placeholder, .field input::placeholder { color: var(--secondary); opacity: 1; }
  .field textarea:focus, .field input:focus { border-color: var(--focus); outline: none; }

  /* Buttons (Figma: Button) */
  .actions { display: flex; flex-direction: column; gap: 4px; }
  .primary, .secondary, .cancel { width: 100%; height: 40px; border-radius: 8px; padding: 8px 12px; cursor: pointer; font-family: var(--font); font-size: 14px; line-height: 20px; font-weight: 500; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .primary { border: 0; background: var(--primary); color: #fff; }
  .primary:hover:not(:disabled) { background: var(--primary-hover); }
  .secondary { border: 1px solid var(--outline); background: var(--surface); color: var(--body); }
  .secondary:hover { border-color: var(--grey-bd); }
  .secondary svg { width: 20px; height: 20px; }
  .cancel { border: 0; background: none; color: var(--red-fg); }
  .primary:disabled, .cancel:disabled { opacity: .5; cursor: not-allowed; }
  .msg { margin: 16px 0 0; font-size: 14px; line-height: 20px; }
  .msg.err { color: var(--red-fg); background: var(--red-bg); padding: 8px 10px; border-radius: 8px; }
  .msg:empty { display: none; }
  .notice { background: var(--red-bg); color: var(--red-fg); padding: 10px 12px; border-radius: 8px; font-size: 13px; }

  /* Feedback */
  .feedback { display: flex; flex-direction: column; gap: 8px; }
  .feedback-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .feedback-head h2 { font-size: 16px; line-height: 24px; font-weight: 500; margin: 0; }
  .fb-meta, .c-meta { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; color: var(--muted); white-space: nowrap; flex-wrap: wrap; }
  .fb-meta .ver { font-weight: 500; }
  .dot { width: 4px; height: 4px; border-radius: 2px; background: currentColor; opacity: .7; flex: none; }
  .comments { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .comment { display: grid; grid-template-columns: 22px 1fr; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .comment.resolved { border-color: var(--success); }
  .pin-no { width: 22px; height: 22px; border-radius: 11px; background: var(--primary); color: #fff; font-size: 12px; line-height: 16px; font-weight: 500; display: grid; place-items: center; }
  .pin-no.general { background: #E3E6EB; color: var(--muted); }
  .comment.resolved .pin-no { background: var(--disabled); }
  .comment > div { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .comment p { margin: 0; font-size: 14px; line-height: 20px; color: var(--body); white-space: pre-wrap; overflow-wrap: anywhere; }
  .comment.resolved p, .comment.resolved .c-meta { color: var(--disabled); }
  .c-meta { color: var(--secondary); }
  .resolved-label { display: inline-flex; align-items: center; gap: 4px; }
  .resolved-label svg { width: 12px; height: 12px; }
  .voice { display: flex; flex-direction: column; gap: 2px; }
  .voice audio { width: 100%; height: 36px; display: block; }
  .voice small { display: flex; justify-content: space-between; font-size: 12px; color: var(--secondary); }
  .voice a { color: var(--secondary); }

  /* Summary (Figma: Summary, Closed / Opened) */
  /* Summary + footer stay pinned to the bottom so nothing jumps between slides */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--canvas); border-top: 1px solid var(--outline); }
  .summary { display: flex; flex-direction: column; gap: 12px; padding: 10px 16px; }
  .summary + .foot { border-top: 1px solid var(--outline); }
  .summary-toggle { display: inline-flex; align-items: center; gap: 4px; align-self: flex-start; border: 0; background: none; padding: 0; height: 20px; cursor: pointer; color: var(--secondary); font-size: 12px; line-height: 16px; }
  .summary-toggle .count { color: var(--muted); }
  .summary-toggle svg { width: 16px; height: 16px; color: var(--muted); transition: transform .15s ease; }
  .summary-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
  .summary-grid { display: flex; flex-wrap: wrap; gap: 4px; max-height: 34vh; overflow-y: auto; padding: 3px 3px 2px; margin: -3px -3px 0; }
  .chip { position: relative; min-width: 24px; height: 26px; padding: 4px 8px; border-radius: 20px; border: 1px solid var(--grey-bd); background: var(--grey-bg); color: var(--body); font-size: 12px; line-height: 16px; cursor: pointer; box-shadow: 0 1px 1px rgba(18,18,23,.05); }
  .chip.ready { background: var(--yellow-bg); border-color: var(--yellow-bd); color: var(--yellow-fg); }
  .chip.changes { background: var(--red-bg); border-color: var(--red-bd); color: var(--red-fg); }
  .chip.approved { background: var(--green-bg); border-color: var(--green-bd); color: var(--green-fg); }
  .chip.current { outline: 2px solid var(--ink); outline-offset: 1px; }
  .chip .bang { position: absolute; top: -1px; right: -3px; width: 10px; height: 10px; border-radius: 5px; background: var(--red-fg); color: #fff; font-size: 8px; line-height: 10px; display: grid; place-items: center; }

  /* Footer pinned to the bottom of the panel */
  .foot { padding: 8px 16px; font-size: 12px; line-height: 16px; color: var(--muted); }
  .foot .link { font-size: 12px; color: var(--muted); }

  /* Sign in (Figma: Frame 23 — flying-slides hero + panel) */
  .login { min-height: 100vh; display: flex; flex-direction: column; background: var(--canvas); }
  .hero { height: 146px; flex-shrink: 0; }
  .login-panel { position: relative; flex: 1; margin-top: -43px; padding: 40px 16px 32px; display: flex; flex-direction: column; gap: 20px;
    background: linear-gradient(to bottom, rgba(246,247,249,0) 0%, rgba(246,247,249,.36) 8.17%, rgba(246,247,249,.72) 23.56%); }
  .login .logo { position: absolute; left: 15px; top: -16px; width: 55px; height: 47px; overflow: visible; } /* 9px above the title */
  .login h1 { font-size: 24px; line-height: 36px; font-weight: 500; margin: 0; color: var(--ink); }
  .login-form { display: flex; flex-direction: column; gap: 24px; }
  .login .field { gap: 8px; }
  .login .field-label { font-size: 16px; line-height: 24px; color: var(--title); }
  .login .field input { height: 40px; padding: 8px; font-size: 16px; line-height: 24px; color: var(--title); }
  .login .field input:focus { border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary); }
  .login .field input[aria-invalid="true"] { border-color: #C0352B; }
  .field-error { font-size: 13px; line-height: 18px; color: #C0352B; }
  .field-error:empty { display: none; }
  .login .msg { margin: 0; }
  @media (prefers-reduced-motion: reduce) { .summary-toggle svg { transition: none; } .sent-overlay { animation: none; } }
</style>
</head>
<body>
<main>
  <div id="configError" class="notice" hidden>Supabase isn't set up yet. Fill in config.js (see the setup guide).</div>

  <!-- Sign in (Figma: Frame 23 — hero + panel) -->
  <section id="loginView" class="login" hidden>
    <div class="hero" id="hero" aria-hidden="true"></div>
    <div class="login-panel">
      <svg class="logo" aria-hidden="true" viewBox="14 17 72 64" >
        <defs>
          <linearGradient id="ss-c3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B7C8EF"/><stop offset="1" stop-color="#9DB3E7"/></linearGradient>
          <linearGradient id="ss-c2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6A8FE0"/><stop offset="1" stop-color="#4A71CC"/></linearGradient>
          <linearGradient id="ss-c1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2C63D6"/><stop offset="1" stop-color="#00308D"/></linearGradient>
        </defs>
        <g><path d="M28.5 19.5 H71.5 Q77 19.5 76.3 25 L72 60 H28 L23.7 25 Q23 19.5 28.5 19.5 Z" fill="url(#ss-c3)"/></g>
        <g><path d="M24.5 25 H75.5 Q81 25 80.3 30.5 L76 66 H24 L19.7 30.5 Q19 25 24.5 25 Z" fill="url(#ss-c2)"/></g>
        <g><path d="M21 31 H79 Q85 31 84.1 37 L78.8 72.5 Q78 78 72.5 78 H27.5 Q22 78 21.2 72.5 L15.9 37 Q15 31 21 31 Z" fill="url(#ss-c1)"/>
          <polyline fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" points="40,54 47,61 61,46"/></g>
      </svg>
      <h1>Sign in to Slideshot</h1>
      <form class="login-form" id="loginForm" novalidate>
        <label class="field"><span class="field-label">Email</span><input id="email" type="email" autocomplete="username" placeholder="you@24slides.com" aria-describedby="emailError"><span class="field-error" id="emailError" aria-live="polite"></span></label>
        <label class="field"><span class="field-label">Password</span><input id="password" type="password" autocomplete="current-password" placeholder="••••••••" aria-describedby="passwordError"><span class="field-error" id="passwordError" aria-live="polite"></span></label>
        <label class="field"><span class="field-label">Your name, as your DM will see it</span><input id="nameInput" autocomplete="name" placeholder="Only needed the first time"></label>
        <button id="signInBtn" class="primary" type="submit">Sign in</button>
        <p id="loginMsg" class="msg" role="status" aria-live="polite"></p>
      </form>
    </div>
  </section>

  <!-- Main -->
  <section id="appView" hidden>
    <div class="container">
      <header class="head">
        <input id="projectName" class="project" aria-label="Project name" spellcheck="false">
        <span id="reviewLinkWrap"></span>
      </header>

      <div id="unsupported" class="notice" hidden>This PowerPoint version can't capture slide images. Update Microsoft 365 to send slides for review.</div>

      <section class="slide-part" aria-label="Selected slide">
        <div class="slide-content">
          <div class="slide-header">
            <div class="meta">
              <span class="meta-label" id="metaLabel">No slide selected</span>
              <span class="tag none" id="curStatus" hidden>Not sent</span>
            </div>
            <div class="thumb">
              <div id="thumb" class="thumb-inner"><span>Select a slide</span></div>
              <div id="tpins" class="tpins" aria-hidden="true"></div>
              <span id="sentBadge" class="sent-badge" hidden></span>
              <button id="refreshBtn" class="thumb-refresh" hidden aria-label="Refresh preview" title="Refresh preview"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2.5v3h-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <div id="sentOverlay" class="sent-overlay" hidden role="status"><span class="ok-icon"><svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M2.5 6.2l2.3 2.3 4.7-4.9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span id="sentOverlayText"></span></div>
            </div>
          </div>
          <p class="sent-note" id="sentNote" hidden></p>
          <button class="add-note" id="addNoteBtn" aria-expanded="false" aria-controls="noteField"><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Add note for DM</button>
          <p class="undo-note" id="undoNote" hidden role="status">Note removed. <button type="button" id="undoNoteBtn">Undo (<span id="undoCount">5</span>)</button></p>
          <div class="field" id="noteField" hidden>
            <div class="field-head"><span>Note for DM</span><button type="button" class="icon-x" id="hideNoteBtn" aria-label="Remove note"><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button></div>
            <textarea id="note" aria-label="Note for DM" placeholder="e.g. Used the client's new icon set on this one"></textarea>
          </div>
        </div>
        <div class="actions" id="actions">
          <button id="updateBtn" class="secondary" hidden><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M10 4v12M4 10h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>Send updated version</button>
          <button id="markBtn" class="primary" disabled>Select a slide</button>
          <button id="cancelUpdateBtn" class="cancel" hidden>Cancel</button>
          <p id="msg" class="msg" role="status" aria-live="polite"></p>
        </div>
      </section>

      <section class="feedback" id="feedback" hidden aria-labelledby="feedbackTitle">
        <div class="feedback-head"><h2 id="feedbackTitle">Feedback</h2><span class="fb-meta" id="feedbackMeta"></span></div>
        <ol id="comments" class="comments"></ol>
      </section>

    </div>

    <div class="dock" id="dock">
      <section class="summary" id="summary" hidden aria-label="Order progress">
        <button class="summary-toggle" id="summaryToggle" aria-expanded="false" aria-controls="summaryGrid"><span id="summaryText"></span><svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3.5 6l4.5 4.5L12.5 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="summary-grid" id="summaryGrid" hidden></div>
      </section>
      <footer class="foot"><span id="whoName"></span> <button id="signOutBtn" class="link">Sign out</button><span id="appVersion"></span></footer>
    </div>
  </section>
</main>

<script>
const IMAGE_WIDTH = 1600, THUMB_WIDTH = 640;
const APP_VERSION = "2.5";
const STATUS_LABEL = { ready: "Waiting for review", approved: "Approved", changes: "Change needed" };
const S = { noteOpen: false, notes: {}, noteFor: null, undo: null, undoTimer: null, updating: {}, justSent: {}, summaryOpen: false, sb: null, user: null, slides: [], currentId: null, latest: {}, comments: {}, canImage: false, busy: false, thumbToken: 0, channel: null, handlerAdded: false };
const $ = (id) => document.getElementById(id);

/* ---------- helpers ---------- */
const docStore = {
  get: (k) => Office.context.document.settings.get(k) || "",
  set: (k, v) => { Office.context.document.settings.set(k, v); Office.context.document.settings.saveAsync(); }
};
function fileTitle() {
  const url = Office.context.document.url || "";
  const base = decodeURIComponent(url.split(/[\\/]/).pop() || "");
  return base.replace(/\.(pptx?|potx)$/i, "") || "Untitled presentation";
}
// Project = the order. Designers on the same order each work in their own copy of the full deck,
// so the project name must match across copies: default to the order number in the file name.
function defaultProject() {
  const t = fileTitle(); const m = t.match(/^\s*#?(\d{5,7})(?!\d)/); // 24Slides file names start with the order number
  return m ? "Order #" + m[1] : t;
}
const projectName = () => docStore.get("slideqa.project") || defaultProject();
// Copies of the same file share the stored id, so each designer gets their own key on top of it.
function baseFileKey() {
  let k = docStore.get("slideqa.fileKey");
  if (!k) { k = crypto.randomUUID(); docStore.set("slideqa.fileKey", k); }
  return k;
}
function fileKey() { return S.user ? baseFileKey() + ":" + S.user.id.slice(0, 8) : baseFileKey(); }
const displayName = (u) => (u && u.user_metadata && u.user_metadata.name) || (u && u.email ? u.email.split("@")[0] : "");
const currentSlide = () => S.slides.find((s) => s.id === S.currentId) || null;

  return new Date(iso).toLocaleDateString();
}

/* ---------- PowerPoint ---------- */
async function readDeck() {
  await PowerPoint.run(async (ctx) => {
    const slides = ctx.presentation.slides; slides.load("items/id");
    const sel = ctx.presentation.getSelectedSlides(); sel.load("items/id");
    await ctx.sync();
    S.slides = slides.items.map((s, i) => ({ id: s.id, n: i + 1 }));
    S.currentId = sel.items.length ? sel.items[0].id : null;
  });
}
async function slideImage(id, width) {
  let v = null;
  await PowerPoint.run(async (ctx) => {
    const r = ctx.presentation.slides.getItem(id).getImageAsBase64({ width: width });
    await ctx.sync(); v = r.value;
  });
  return v;
}
async function slideExport(id) {
  let v = null;
  await PowerPoint.run(async (ctx) => {
    const r = ctx.presentation.slides.getItem(id).exportAsBase64();
    await ctx.sync(); v = r.value;
  });
  return v;
}
// Fonts, sizes and speaker notes for the DM. Never blocks sending if it fails.
async function readDetails(id) {
  let stage = "load";
  try {
    if (!window.JSZip || !window.SlideDetails) throw new Error("inspector scripts did not load");
    stage = "export";
    const b64 = await slideExport(id);
    if (!b64) throw new Error("PowerPoint returned an empty export");
    stage = "parse";
    return await window.SlideDetails.fromBase64(b64);
  } catch (e) {
    console.warn("Slide details not captured:", e);
    const msg = (e && e.code ? e.code + ": " : "") + ((e && e.message) || String(e));
    return { version: 1, error: stage + " step failed (" + msg + ")" };
  }
}
async function selectSlide(id) {
  await PowerPoint.run(async (ctx) => { ctx.presentation.setSelectedSlides([id]); await ctx.sync(); });
}

/* ---------- Supabase ---------- */
async function loadReviews() {
  // Mine = sent by this account from this file (including slides sent before per-designer keys existed)
  const { data, error } = await S.sb.from("slide_shots").select("*").eq("designer_id", S.user.id).in("file_key", [fileKey(), baseFileKey()]).order("version", { ascending: false });
  if (error) throw error;
  S.latest = {};
  data.forEach((r) => { const cur = S.latest[r.slide_id]; if (!cur || r.version > cur.version) S.latest[r.slide_id] = r; });
  const ids = Object.values(S.latest).map((r) => r.id);
  S.comments = {};
  if (ids.length) {
    const res = await S.sb.from("shot_comments").select("*").in("shot_id", ids).order("created_at");
    if (res.error) throw res.error;
    res.data.forEach((c) => { (S.comments[c.shot_id] = S.comments[c.shot_id] || []).push(c); });
  }
  // Teammates working on the same order, in their own copies of the deck
  const team = await S.sb.from("slide_shots").select("file_key,slide_id,slide_number,version,status,designer,created_at,image_path").eq("project", projectName()).neq("designer_id", S.user.id);
  S.team = {};
  if (!team.error) team.data.forEach((r) => { const k = r.file_key + "|" + r.slide_id; if (!S.team[k] || r.version > S.team[k].version) S.team[k] = r; });
}
let reviewsTimer = null, lastReviewLoad = 0;
// Re-check statuses after slide changes and every 20s, in case a live update was missed.
function refreshReviewsSoon() {
  if (!S.user || Date.now() - lastReviewLoad < 3000) return;
  clearTimeout(reviewsTimer);
  reviewsTimer = setTimeout(async () => { try { lastReviewLoad = Date.now(); await loadReviews(); render(); } catch (e) {} }, 400);
}
function subscribe() {
  if (S.channel) S.sb.removeChannel(S.channel);
  const reload = debounce(async () => { try { await loadReviews(); render(); } catch (e) {} }, 400);
  S.channel = S.sb.channel("deck-" + fileKey())
    .on("postgres_changes", { event: "*", schema: "public", table: "slide_shots", filter: "file_key=eq." + fileKey() }, reload)
    .on("postgres_changes", { event: "*", schema: "public", table: "shot_comments" }, (p) => {
      const id = (p.new && p.new.shot_id) || (p.old && p.old.shot_id);
      if (Object.values(S.latest).some((r) => r.id === id)) reload();
    })
    .subscribe();
}

  if (team) return { mode: "teammate", team };
  if (!shot) return { mode: "notsent" };
  if (S.updating[cur.id] && shot.status !== "approved") return { mode: "update", shot };
  return { mode: "locked", shot };
}

    let pinNo = 0;

  const grid = $("summaryGrid"); grid.hidden = !open; grid.innerHTML = "";
  nums.forEach((n) => {

// ---- voice notes from the DM
const VOICE = new Map(); // comment id -> element, reused so playback survives re-renders
const SIGNED = {};       // storage path -> { url, exp }
const fmtDur = (sec) => { const t = Math.max(0, Math.floor(sec)); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); };
function voiceEl(c) {
  let w = VOICE.get(c.id);
  if (!w) {
    w = document.createElement("div"); w.className = "voice";
    const a = document.createElement("audio"); a.controls = true; a.preload = "metadata";
    const sm = document.createElement("small");
    const label = document.createElement("span"); label.textContent = "Voice note" + (c.audio_duration ? ", " + fmtDur(c.audio_duration) : "");
    const link = document.createElement("a"); link.textContent = "Open"; link.target = "_blank"; link.rel = "noopener"; link.hidden = true;
    sm.append(label, link); w.append(a, sm); VOICE.set(c.id, w);
  }
  return w;
}
async function fillVoiceSources(cs) {
  const need = cs.filter((c) => c.audio_path && (!SIGNED[c.audio_path] || SIGNED[c.audio_path].exp < Date.now() + 60000)).map((c) => c.audio_path);
  if (need.length) {
    const { data, error } = await S.sb.storage.from("slides").createSignedUrls(need, 3600);
    if (error) return;
    data.forEach((d) => { if (d.signedUrl) SIGNED[d.path] = { url: d.signedUrl, exp: Date.now() + 3600 * 1000 }; });
  }
  cs.forEach((c) => {
    const w = c.audio_path && VOICE.get(c.id); const u = c.audio_path && SIGNED[c.audio_path] && SIGNED[c.audio_path].url;
    if (!w || !u) return;
    const a = w.querySelector("audio"), link = w.querySelector("a");
    if (!a.getAttribute("src")) a.src = u;
    link.href = u; link.hidden = false;
  });
}
async function signedUrl(path) {
  if (SIGNED[path] && SIGNED[path].exp > Date.now() + 60000) return SIGNED[path].url;
  const { data, error } = await S.sb.storage.from("slides").createSignedUrls([path], 3600);
  if (error || !data[0] || !data[0].signedUrl) return null;
  SIGNED[path] = { url: data[0].signedUrl, exp: Date.now() + 3600 * 1000 };
  return SIGNED[path].url;
}
// Live slide while it hasn't been sent (or a new version is being prepared); the sent snapshot otherwise
async function renderThumb() {
  const cur = currentSlide(), box = $("thumb"), token = ++S.thumbToken;
  if (!cur) { box.innerHTML = "<span>Select a slide</span>"; return; }
  const v = viewFor(cur);
  const snapshotPath = v.mode === "locked" ? v.shot.image_path : v.mode === "teammate" ? v.team.image_path : null;
  try {
    let src = null;
    if (snapshotPath) { const u = await signedUrl(snapshotPath); src = u; }
    else if (S.canImage) { src = "data:image/png;base64," + await slideImage(cur.id, THUMB_WIDTH); }
    if (token !== S.thumbToken) return;
    if (!src) { box.innerHTML = "<span>Slide " + cur.n + "</span>"; return; }
    const existing = box.querySelector("img");
    if (existing && existing.getAttribute("src") === src) return;
    box.innerHTML = ""; const img = new Image();
    img.alt = (snapshotPath ? "Sent version of slide " : "Slide ") + cur.n; img.src = src; box.append(img);
  } catch (e) { if (token === S.thumbToken) box.innerHTML = "<span>Preview unavailable</span>"; }
}
async function refreshDeck() {
  try { await readDeck(); S.thumbKey = null; render(); refreshReviewsSoon(); }
  catch (e) { say($("msg"), "Couldn't read the presentation: " + e.message, "err"); }
}

/* ---------- actions ---------- */
async function markReady() {
  const cur = currentSlide(); if (!cur) return;
  const prev = S.latest[cur.id];
  const version = prev ? prev.version + 1 : 1;
  S.busy = true; render();
  say($("msg"), "Capturing slide " + cur.n + "…");
  try {
    const b64 = await slideImage(cur.id, IMAGE_WIDTH);
    const details = await readDetails(cur.id);
    const key = fileKey();
    const path = key + "/" + cur.id.replace(/[^a-zA-Z0-9_-]/g, "_") + "/v" + version + "-" + Date.now() + ".png";
    say($("msg"), "Uploading slide " + cur.n + "…");
    const up = await S.sb.storage.from("slides").upload(path, b64ToBlob(b64, "image/png"), { contentType: "image/png" });
    if (up.error) throw up.error;
    const ins = await S.sb.from("slide_shots").insert({
      file_key: key, project: projectName(), slide_id: cur.id, slide_number: cur.n, total_slides: S.slides.length,
      version: version, designer: displayName(S.user), note: (!$("noteField").hidden && $("note").value.trim()) || null, image_path: path, details: details
    }).select().single();
    if (ins.error) throw ins.error;
    S.latest[cur.id] = ins.data;
    $("note").value = ""; S.noteOpen = false; delete S.notes[cur.id];
    S.updating[cur.id] = false; S.justSent[cur.id] = Date.now(); say($("msg"), "");
    setTimeout(render, 2700);
  } catch (e) {
    say($("msg"), "Slide " + cur.n + " wasn't sent: " + (e.message || e) + ". Check your connection and try again.", "err");
  } finally {
    S.busy = false;
    try { await loadReviews(); } catch (e) {}
    render(); renderThumb();
  }
}

function setFieldError(id, msg) {
  $(id + "Error").textContent = msg || "";
  $(id).setAttribute("aria-invalid", msg ? "true" : "false");
}
async function signIn() {
  const email = $("email").value.trim(), password = $("password").value, name = $("nameInput").value.trim();
  setFieldError("email", ""); setFieldError("password", ""); say($("loginMsg"), "");
  let ok = true;
  if (!email) { setFieldError("email", "Enter your email"); ok = false; }
  else if (!/^\S+@\S+\.\S+$/.test(email)) { setFieldError("email", "Enter a valid email"); ok = false; }
  if (!password) { setFieldError("password", "Enter your password"); ok = false; }
  if (!ok) return;
  const btn = $("signInBtn"); btn.disabled = true; btn.textContent = "Signing in…";
  const { data, error } = await S.sb.auth.signInWithPassword({ email: email, password: password });
  btn.disabled = false; btn.textContent = "Sign in";
  if (error) {
    if (/invalid login credentials/i.test(error.message)) setFieldError("password", "Email or password is incorrect. Try again.");
    else say($("loginMsg"), "Couldn't sign in: " + error.message, "err");
    return;
  }
  let user = data.user;
  if (name) { const upd = await S.sb.auth.updateUser({ data: { name: name } }); if (!upd.error) user = upd.data.user; }
  say($("loginMsg"), "");
  enterApp(user);
}

async function enterApp(user) {
  S.user = user;
  if (S.hero) { S.hero.destroy(); S.hero = null; }
  $("loginView").hidden = true; $("appView").hidden = false;
  if (!S.handlerAdded) {
    Office.context.document.addHandlerAsync(Office.EventType.DocumentSelectionChanged, debounce(refreshDeck, 250));
    S.handlerAdded = true;
  }
  await refreshDeck();
  try { await loadReviews(); } catch (e) { say($("msg"), "Couldn't load review status: " + e.message, "err"); }
  render();
  subscribe();
  setInterval(() => { if (!document.hidden) refreshReviewsSoon(); }, 20000);
  // Keep the live preview fresh while a new version is being prepared
  setInterval(() => { const c = currentSlide(); if (!document.hidden && c && viewFor(c).mode === "update" && !S.busy) renderThumb(); }, 5000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refreshReviewsSoon(); });
}

function showLogin() {
  S.user = null;
  $("appView").hidden = true; $("loginView").hidden = false;
  // Flying-slides hero runs only while the sign-in screen is visible
  if (!S.hero && window.SlideshotHero) S.hero = SlideshotHero.mount($("hero"), { theme: "pastel", height: 146 });

}

    clearInterval(S.undoTimer);
    S.notes[S.undo.id] = S.undo.text; if (S.undo.id === S.currentId) $("note").value = S.undo.text;
    S.undo = null; S.noteOpen = true; render(); $("note").focus();
  };
  $("appVersion").textContent = " · v" + APP_VERSION;
  // Keep page content clear of the pinned dock as it grows or shrinks
  const syncDock = () => document.documentElement.style.setProperty("--dock-h", $("dock").offsetHeight + "px");
  if (window.ResizeObserver) new ResizeObserver(syncDock).observe($("dock")); else window.addEventListener("resize", syncDock);
  syncDock();
  $("updateBtn").onclick = () => { const c = currentSlide(); if (!c) return; S.updating[c.id] = true; say($("msg"), ""); render(); renderThumb(); };
  $("cancelUpdateBtn").onclick = () => { const c = currentSlide(); if (!c) return; S.updating[c.id] = false; say($("msg"), ""); render(); renderThumb(); $("updateBtn").focus(); };
  $("refreshBtn").onclick = () => renderThumb();
  try { S.summaryOpen = localStorage.getItem("qa.summaryOpen") === "1"; } catch (e) {}
  $("summaryToggle").onclick = () => { S.summaryOpen = !S.summaryOpen; try { localStorage.setItem("qa.summaryOpen", S.summaryOpen ? "1" : "0"); } catch (e) {} render(); };
  $("signOutBtn").onclick = async () => { await S.sb.auth.signOut(); showLogin(); };
  $("projectName").addEventListener("change", (e) => {
    const v = e.target.value.trim();
    docStore.set("slideqa.project", v && v !== fileTitle() ? v : "");
    render();
  });

  const { data } = await S.sb.auth.getSession();
  if (data.session) enterApp(data.session.user); else showLogin();
});
</script>
</body>
</html>
